<style>
  :root{
    --paper: #f2ede4;
    --paper-2: #e9e2d5;
    --ink: #2a2320;
    --ink-soft: #6b5f55;
    --line: rgba(42,35,32,0.14);
    --brand: #e84e10;
    --brand-dark: #c93e07;
    --brand-deep: #8a2b05;
    --brand-light: #f0865c;
    --ok: #4c7a4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px),
      radial-gradient(ellipse at top left, rgba(255,255,255,0.5), transparent 55%);
    background-size: 100% 42px, 42px 100%, 100% 100%;
    background-position: 0 90px, 0 0, 0 0;
    font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .sheet{
    width:100%;
    max-width:760px;
    background:#fffdf9;
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 30px 70px -28px rgba(42,35,32,0.4);
    position:relative;
    overflow:hidden;
    min-height:660px;
    display:flex;
    flex-direction:column;
  }
  .brandbar{
    height:6px; width:100%; flex:0 0 auto;
    background: linear-gradient(90deg, var(--brand-light), var(--brand), var(--brand-dark));
  }
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 26px; border-bottom:1px solid var(--line); flex:0 0 auto;
    background:#fffefb;
  }
  .header img{ height:32px; display:block; }
  .header .branch{
    font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-weight:700; font-size:12px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--brand); text-align:right; line-height:1.4;
  }
  .header .branch span{ display:block; color:var(--ink-soft); font-weight:500; font-size:10.5px; letter-spacing:0.06em; }

  .pad{ padding:26px 34px 26px 34px; position:relative; flex:1; display:flex; flex-direction:column; }
  @media (max-width:560px){ .pad{ padding:20px 18px; } .header{ padding:12px 16px; } .header img{ height:26px; } }

  .eyebrow{
    font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-soft); display:flex; align-items:center; gap:9px; margin-bottom:12px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);}

  h1{ font-family:'Zilla Slab', Georgia, 'Times New Roman', serif; font-weight:700; font-size:27px; line-height:1.18; margin:0 0 10px; }
  h2{ font-family:'Zilla Slab', Georgia, 'Times New Roman', serif; font-weight:600; font-size:20px; margin:0 0 14px; line-height:1.35; }
  p{ line-height:1.55; color:var(--ink-soft); font-size:15px; margin:0 0 12px; }

  label{ display:block; font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; margin-top:16px; }
  input[type=text], input[type=tel]{ width:100%; border:none; border-bottom:2px solid var(--ink); background:transparent; font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size:18px; padding:8px 2px; color:var(--ink); outline:none; }
  input[type=text]:focus, input[type=tel]:focus{ border-color:var(--brand); }

  .btn{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase; font-weight:700; border:2px solid var(--ink); background:var(--ink); color:#fffdf9; padding:13px 20px; border-radius:4px; cursor:pointer; transition: transform .12s ease, background .15s ease, box-shadow .15s ease; white-space:nowrap; }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0px) scale(0.98); }
  .btn:disabled{ opacity:0.32; cursor:not-allowed; transform:none; }
  .btn.brand{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .footer-actions{ margin-top:auto; padding-top:22px; display:flex; justify-content:space-between; align-items:center; gap:12px; }

  .stat-row{ display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 4px; }
  .stat-chip{ display:flex; align-items:center; gap:7px; background:#fbf3ec; border:1px solid rgba(232,78,16,0.25); border-radius:20px; padding:7px 12px; font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:11px; color:var(--brand-dark); font-weight:700; }
  .stat-chip .ic{ width:14px;height:14px; flex:0 0 14px; }

  /* progress: overall bar + section stepper */
  .progress-wrap{ margin-bottom:16px; }
  .overall-bar{ height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-bottom:12px; }
  .overall-bar > div{ height:100%; background:linear-gradient(90deg, var(--brand-light), var(--brand)); transition:width .3s ease; }
  .stepper{ display:flex; gap:8px; }
  .step-chip{ flex:1; text-align:center; padding:7px 4px; border-radius:5px; border:1.5px solid var(--line); font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); }
  .step-chip.active{ border-color:var(--brand); color:var(--brand); background:#fbf3ec; font-weight:700; }
  .step-chip.done{ border-color:var(--ok); color:var(--ok); }

  .qmeta{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:12px; color:var(--ink-soft); margin-bottom:14px; display:flex; justify-content:space-between; }

  .options{ display:flex; flex-direction:column; gap:9px; margin-top:4px; }
  .opt{ display:flex; align-items:center; gap:13px; padding:13px 15px; border:1.5px solid var(--line); border-radius:5px; cursor:pointer; background:#fbf9f5; transition: border-color .12s ease, background .12s ease, transform .1s ease; font-size:15.5px; }
  .opt:hover{ border-color:var(--ink-soft); }
  .opt.selected{ border-color:var(--brand); background:#fbf0ea; transform:translateX(2px); }
  .opt .mark{ width:24px; height:24px; flex:0 0 24px; border-radius:50%; border:2px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:11px; color:var(--ink-soft); }
  .opt.selected .mark{ border-color:var(--brand); color:var(--brand); }
  .opt.selected .mark::after{ content:""; width:11px;height:11px;border-radius:50%; background:var(--brand); }

  .passage{ background:#fbf9f5; border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:4px; padding:16px 18px; font-size:15px; line-height:1.65; color:var(--ink); margin-bottom:8px; }
  .passage-ref{ font-size:13px; color:var(--ink-soft); cursor:pointer; margin-bottom:14px; display:inline-block; }
  .passage-sticky{ font-size:13.5px; line-height:1.55; max-height:140px; overflow-y:auto; margin-bottom:14px; }
  .passage-title{ font-weight:700; color:var(--ink); margin-bottom:6px; }
  .passage-label{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--brand-dark); font-weight:700; margin-bottom:6px; }

  /* fact card */
  .fact-card{
    display:flex; gap:12px; align-items:flex-start; background:#fff7f1; border:1px dashed rgba(232,78,16,0.4);
    border-radius:6px; padding:13px 15px; margin:14px 0 4px;
  }
  .fact-card img{ width:26px; height:26px; flex:0 0 26px; margin-top:2px; }
  .fact-card .txt{ font-size:13.5px; color:var(--ink); line-height:1.5; }
  .fact-card .txt b{ color:var(--brand-dark); }

  /* speaking */
  .speak-wrap{ display:flex; align-items:center; gap:20px; margin:10px 0 6px; }
  .speak-prompt{ font-family:'Zilla Slab', Georgia, 'Times New Roman', serif; font-size:19px; line-height:1.4; }
  .speak-wrap svg{ flex:0 0 72px; }
  @media (max-width:360px){ .footer-actions .btn{ white-space:normal; line-height:1.35; text-align:center; } }

  .speak-en{ font-size:14px; color:var(--ink-soft); margin-top:6px; font-style:italic; line-height:1.4; }
  .rec-hint{ font-size:13px; }
  .meter{ height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin:4px 0 6px; }
  .meter > div{ height:100%; width:0%; background:linear-gradient(90deg, #4c7a4a, #d9a441, #e84e10); transition:width .08s linear; }
  .rec-holat{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:12px; color:var(--ink-soft); min-height:18px; }
  .rec-holat.on{ color:#b8362c; font-weight:700; }
  .rec-holat.on::before{ content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:#d23a2a; margin-right:7px; vertical-align:middle; animation:rec-pulse 1s infinite; }
  @keyframes rec-pulse{ 50%{ opacity:.25; } }
  .btn.rec{ background:#d23a2a; border-color:#d23a2a; color:#fff; }
  .linkbtn{ background:none; border:none; color:var(--ink-soft); font-size:13px; text-decoration:underline; cursor:pointer; padding:6px 2px; font-family:inherit; }

  /* speaking natijasi (sun'iy intellekt) */
  .ai-wait{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink); line-height:1.45; }
  .spin{ width:18px; height:18px; border-radius:50%; border:2.5px solid var(--line); border-top-color:#e84e10; animation:spin .8s linear infinite; flex:0 0 18px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .ai-top{ display:flex; align-items:center; gap:14px; margin:4px 0 10px; }
  .cefr{ font-family:'Zilla Slab', Georgia, 'Times New Roman', serif; font-weight:700; font-size:28px; color:#fff; background:#e84e10; border-radius:8px; padding:4px 12px; line-height:1.15; white-space:nowrap; }
  .cefr-txt{ font-size:13.5px; color:var(--ink); line-height:1.45; }
  .cefr-txt b{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
  .sub{ display:grid; grid-template-columns:88px 1fr 40px; gap:6px 10px; align-items:center; font-size:12.5px; margin:6px 0 10px; }
  .sub .tr{ height:7px; border-radius:4px; background:var(--line); overflow:hidden; }
  .sub .tr > div{ height:100%; background:#f0865c; border-radius:4px; }
  .sub .v{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:11.5px; color:var(--ink-soft); text-align:right; }
  .ai-izoh{ font-size:13px; line-height:1.5; color:var(--ink); margin:0; padding-left:18px; }
  .ai-izoh li{ margin-bottom:5px; }
  .ai-note{ font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.45; }

  /* result gauge */
  .transition-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:2px; }
  .gauge-wrap{ width:100%; max-width:520px; margin:6px auto 8px; }
  .gauge-caption{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; fill:var(--ink-soft); }

  .congrats-box{
    background:#fff7f1; border:1.5px solid rgba(232,78,16,0.3); border-radius:8px; padding:18px 22px; margin:14px 0;
    text-align:left;
  }
  .congrats-box .big{ font-family:'Zilla Slab', Georgia, 'Times New Roman', serif; font-weight:700; font-size:19px; color:var(--brand-dark); margin-bottom:6px; }
  .congrats-box p{ margin-bottom:0; font-size:14.5px; }

  .chart-row{ display:flex; gap:22px; align-items:flex-end; height:104px; margin:16px 0; justify-content:center; }
  .chart-bar-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; width:74px; }
  .chart-bar-track{ width:34px; height:76px; background:var(--line); border-radius:6px; position:relative; overflow:hidden; display:flex; align-items:flex-end; }
  .chart-bar-fill{ width:100%; border-radius:6px 6px 0 0; transition:height .6s cubic-bezier(.2,.8,.3,1); }
  .chart-bar-label{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:10.5px; color:var(--ink-soft); text-align:center; }
  .chart-bar-val{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:12px; font-weight:700; }
  .speak-done-chip{ display:flex; flex-direction:column; align-items:center; gap:8px; width:74px; }
  .speak-done-chip .circ{ width:34px;height:34px;border-radius:50%; border:2px solid var(--ok); color:var(--ok); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-weight:700; font-size:13px; }

  .section-cards{ display:flex; flex-direction:column; gap:10px; width:100%; margin-bottom:6px; }
  .section-card{ background:#fbf9f5; border:1px solid var(--line); border-radius:8px; padding:13px 16px; text-align:left; }
  .sc-head{ font-family:'Zilla Slab', Georgia, 'Times New Roman', serif; font-weight:600; font-size:15px; margin-bottom:8px; }
  .sc-bar-track{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; margin-bottom:7px; }
  .sc-bar-fill{ height:100%; border-radius:5px; transition:width .6s cubic-bezier(.2,.8,.3,1); }
  .sc-meta{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:12px; color:var(--ink-soft); }
  .stars{ display:flex; gap:6px; }
  .stars .star{ font-size:26px; color:var(--line); cursor:pointer; user-select:none; transition:color .12s ease, transform .12s ease; }
  .stars .star:hover{ transform:scale(1.12); }
  .stars .star.filled{ color:#d9a441; }

  .roadmap{ width:100%; background:#fbf9f5; border:1px solid var(--line); border-radius:8px; padding:14px 16px; text-align:left; }
  .road-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .road-row:last-of-type{ border-bottom:none; }
  .road-dot{ width:10px; height:10px; border-radius:50%; border:2px solid var(--ink-soft); flex:0 0 10px; }
  .road-txt{ flex:1; font-size:13.5px; }
  .road-here{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:10px; color:var(--brand-dark); text-transform:uppercase; }
  .road-months{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; color:var(--ink-soft); font-weight:700; }
  .road-total{ margin-top:8px; padding-top:8px; border-top:1.5px solid var(--line); font-size:13.5px; text-align:right; }

  .footer-info{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:11px; color:var(--ink-soft); text-align:center; margin-top:16px; line-height:1.7; }
  .footer-info b{ color:var(--brand-dark); }

  .confetti-piece{ position:absolute; width:7px; height:13px; top:-16px; z-index:5; animation: confetti-fall 1.9s ease-in forwards; pointer-events:none; }
  @keyframes confetti-fall{ to{ transform: translateY(520px) rotate(420deg); opacity:0; } }

  .yubor{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:12px; margin:14px 0 0; color:var(--ink-soft); }
  .yubor.ok{ color:#4c7a4a; font-weight:700; }
  .yubor.kut{ color:#a97d1f; font-weight:700; }
  .admin-link{ position:fixed; bottom:14px; right:16px; font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:11px; color:var(--ink-soft); opacity:0.55; text-decoration:none; background:none; border:none; cursor:pointer; }
  .admin-link:hover{ opacity:0.9; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:14px;}
  th,td{ text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); }
  .pin-box{ display:flex; gap:8px; margin-top:14px; }
  .pin-box input{ text-align:center; letter-spacing:0.3em; font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>

  {uz:"Kelajakdagi rejalaringiz yoki maqsadlaringiz haqida gapiring.", en:"Talk about your plans or goals for the future."},
  {uz:"Ijtimoiy tarmoqlarning foyda va zararlari haqida fikringizni ayting.", en:"Give your opinion on the advantages and disadvantages of social media."},
];

/* linear steps that make up the whole test */
const STEPS = [
  {type:'grammar', from:0, to:30},
  {type:'reading', passage:0},
  {type:'reading', passage:1},
  {type:'reading', passage:2},
  {type:'speaking', idx:0},
  {type:'speaking', idx:1},
  {type:'speaking', idx:2},
];
const TOTAL_ITEMS = 30 + 10; // scored items only, for the overall bar

/* ---------------- state ---------------- */
let state = {};
function resetState(){
  state = {
    screen:'start',
    name:"", phone:"",
    stepIndex:0,
    subIdx:0,
    selected:null,
    grammarCorrect:0,
    readingCorrect:0,
    itemsDone:0,
    speakTimerId:null,
    speakSecondsLeft:45,
    id:null,                               // yozma qism tugaganda beriladi (jadvaldagi qator)
    javoblar:[],                           // {k:'G'|'R', t: tanlangan, a: to'g'risi}
    speak:[null,null,null],                // har topshiriq: {holat:'kutilmoqda'|'tayyor'|'xato', baho}
    mic: ovozBormi() ? null : 'yoq',       // null — hali sinalmagan, 'ok', 'yoq' (xodim tinglaydi)
    rec:'tayyor',                          // joriy topshiriq: tayyor | yozmoqda | jim
    fakt:'',
    natijaHolat:null,                      // natija jadvalga yetdimi: null | true | false
  };
}
resetState();
const app = document.getElementById('app');

function esc(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function clearSpeakTimer(){ if(state.speakTimerId){ clearInterval(state.speakTimerId); state.speakTimerId=null; } }
function nextFact(){ const f = FACTS[factCounter % FACTS.length]; factCounter++; return f; }

function headerHtml(){
  return `
    <div class="brandbar"></div>
    <div class="header">
      <img src="${LOGO_FULL}" alt="Registon o'quv markazi">
      <div class="branch">Kattaqo'rg'on <span>filiali</span></div>
    </div>
  `;
}

function render(){
  let body = '';
  if(state.screen==='start') body = renderStart();
  else if(state.screen==='test') body = renderTest();
  else if(state.screen==='final') body = renderFinal();
  app.innerHTML = headerHtml() + body;
  wireUpEvents();
}

/* ---------------- start ---------------- */
function renderStart(){
  return `
    <div class="pad">
      <div class="eyebrow"><span class="dot"></span>Ingliz tili · Daraja aniqlash testi</div>
      <h1>Darajangizni bilib olamiz</h1>
      <p>Test bitta yaxlit tarzda o'tkaziladi: <strong>30 ta grammatika</strong>, <strong>3 ta matn (10 ta savol)</strong> va <strong>3 ta speaking topshirig'i</strong>. Speaking'da telefonga ingliz tilida gapirasiz — javobingizni sun'iy intellekt darhol baholaydi. Oxirida sizga aynan qaysi darajadan boshlashingiz kerakligini ko'rsatamiz.</p>
      <div class="stat-row">
        <div class="stat-chip">1500+ o'quvchi</div>
        <div class="stat-chip">IELTS 7.0+ natija</div>
        <div class="stat-chip">Haftasiga 6 kun dars</div>
      </div>
      <label for="nameInput">Ismingiz</label>
      <input type="text" id="nameInput" placeholder="Ism Familiya" value="${esc(state.name)}">
      <label for="phoneInput">Telefon raqam (ixtiyoriy)</label>
      <input type="tel" id="phoneInput" placeholder="+998 90 000 00 00" value="${esc(state.phone)}">
      <div class="footer-actions">
        <span></span>
        <button class="btn brand" id="startBtn">Testni boshlash →</button>
      </div>
    </div>
  `;
}

/* ---------------- test dispatcher ---------------- */
function currentStep(){ return STEPS[state.stepIndex]; }

function renderTest(){
  const step = currentStep();
  if(step.type==='grammar') return renderQuestionScreen('grammar');
  if(step.type==='reading'){
    if(state.subIdx===-1) return renderReadingIntro();
    return renderQuestionScreen('reading');
  }
  if(step.type==='speaking') return renderSpeaking();
}

function progressStepper(){
  const sections = ['grammar','reading','speaking'];
  const doneSections = new Set();
  for(let i=0;i<state.stepIndex;i++) doneSections.add(STEPS[i].type);
  const cur = currentStep().type;
  return `
    <div class="progress-wrap">
      <div class="overall-bar"><div style="width:${Math.round((state.itemsDone/TOTAL_ITEMS)*100)}%;"></div></div>
      <div class="stepper">
        <div class="step-chip ${cur==='grammar'?'active':(doneSections.has('grammar')&&cur!=='grammar'?'done':'')}">🔤 Grammatika</div>
        <div class="step-chip ${cur==='reading'?'active':(doneSections.has('reading')&&cur!=='reading'?'done':'')}">📖 Reading</div>
        <div class="step-chip ${cur==='speaking'?'active':(doneSections.has('speaking')&&cur!=='speaking'?'done':'')}">🎤 Speaking</div>
      </div>
    </div>
  `;
}

/* ---------------- grammar / reading question ---------------- */
function renderQuestionScreen(kind){
  const step = currentStep();
  let list, labelTotal, labelIdx;
  if(kind==='grammar'){
    list = GRAMMAR.slice(step.from, step.to);
    labelTotal = list.length;
    labelIdx = state.subIdx;
  } else {
    list = READING[step.passage].questions;
    labelTotal = list.length;
    labelIdx = state.subIdx;
  }
  const q = list[labelIdx];
  const passageBlock = kind==='reading' ? `
    <div class="passage passage-sticky">
      <div class="passage-label">📖 Matn</div>
      ${passageTitle(step.passage)}${esc(READING[step.passage].passage)}
    </div>` : '';

  return `
    <div class="pad">
      <div class="eyebrow"><span class="dot"></span>${kind==='grammar'?'Grammatika bo\'limi':'Reading bo\'limi'}</div>
      ${progressStepper()}
      ${passageBlock}
      <div class="qmeta"><span>Savol ${labelIdx+1} / ${labelTotal}</span><span>${state.itemsDone+1} / ${TOTAL_ITEMS} umumiy</span></div>
      <h2>${esc(q.q)}</h2>
      <div class="options" id="optionsWrap">
        ${q.o.map((opt,i)=>`
          <div class="opt" data-i="${i}">
            <div class="mark">${String.fromCharCode(65+i)}</div>
            <div>${esc(opt)}</div>
          </div>`).join('')}
      </div>
      <div class="footer-actions">
        <span></span>
        <button class="btn brand" id="nextBtn" disabled>Keyingisi →</button>
      </div>
    </div>
  `;
}

function wireUpEvents(){
  const startBtn = document.getElementById('startBtn');
  if(startBtn){
    const nameInput = document.getElementById('nameInput');
    const phoneInput = document.getElementById('phoneInput');
    nameInput.addEventListener('input', e=> state.name = e.target.value);
    phoneInput.addEventListener('input', e=> state.phone = e.target.value);
    startBtn.addEventListener('click', ()=>{
      if(!state.name.trim()){ nameInput.style.borderColor='var(--brand)'; nameInput.focus(); return; }
      state.screen='test'; state.stepIndex=0; state.subIdx = currentStep().type==='reading' ? -1 : 0;
      render();
    });
    return;
  }
  const opts = document.querySelectorAll('.opt');
  if(opts.length){
    const nextBtn = document.getElementById('nextBtn');
    opts.forEach(el=>{
      el.addEventListener('click', ()=>{
        opts.forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
        state.selected = parseInt(el.dataset.i,10);
        nextBtn.disabled=false;
      });
    });
    nextBtn.addEventListener('click', onQuestionAnswered);
    return;
  }
  const goReading = document.getElementById('goReading');
  if(goReading){ goReading.addEventListener('click', ()=>{ state.subIdx=0; render(); }); return; }

  const doneSpeak = document.getElementById('doneSpeak');
  if(doneSpeak){ doneSpeak.addEventListener('click', advanceSpeaking); updateRing(); return; }

  const recBtn = document.getElementById('recBtn') || document.getElementById('qaytaBtn');
  if(recBtn){
    recBtn.addEventListener('click', yozishniBoshla);
    const otkaz = document.getElementById('otkazBtn');
    if(otkaz) otkaz.addEventListener('click', ()=>{ clearSpeakTimer(); state.rec='tayyor'; goToNextStep(); });
    updateRing();
    return;
  }
  const stopBtn = document.getElementById('stopBtn');
  if(stopBtn){ stopBtn.addEventListener('click', yozishniTugat); updateRing(); return; }

  const restartBtn = document.getElementById('restartBtn');
  if(restartBtn){ restartBtn.addEventListener('click', ()=>{ Ovoz.yop(); resetState(); render(); }); }

  if(document.getElementById('speakKarta')){ starlarniUla(); holat(state.natijaHolat); }
}

function onQuestionAnswered(){
  const step = currentStep();
  const kind = step.type;
  const list = kind==='grammar' ? GRAMMAR.slice(step.from, step.to) : READING[step.passage].questions;
  const q = list[state.subIdx];
  const isCorrect = state.selected === q.a;
  if(kind==='grammar' && isCorrect) state.grammarCorrect++;
  if(kind==='reading' && isCorrect) state.readingCorrect++;
  state.javoblar.push({k: kind==='grammar' ? 'G' : 'R', t: state.selected, a: q.a});
  state.selected=null;
  state.itemsDone++;
  state.subIdx++;

  if(state.subIdx >= list.length){
    goToNextStep();
    return;
  }
  render();
}

function goToNextStep(){
  state.stepIndex++;
  if(state.stepIndex >= STEPS.length){
    finalizeResult();
    return;
  }
  const step = currentStep();
  if(step.type==='reading') state.subIdx=-1;
  else if(step.type==='speaking'){
    if(!state.id) yozmaYakun();          // yozma qism tugadi — natija darhol jadvalga
    state.speakSecondsLeft=45; state.rec='tayyor'; state.fakt=nextFact();
    render();
    if(state.mic==='yoq') startSpeakTimer();   // mikrofon yo'q — eski tartib: xodim tinglaydi
    return;
  }
  else state.subIdx=0;
  render();
}

/* ---------------- reading intro ---------------- */
function renderReadingIntro(){
  const step = currentStep();
  return `
    <div class="pad">
      <div class="eyebrow"><span class="dot"></span>Reading bo'limi</div>
      ${progressStepper()}
      <h2>Matnni diqqat bilan o'qing</h2>
      <div class="passage">${passageTitle(step.passage)}${esc(READING[step.passage].passage)}</div>
      <p>Keyingi sahifada shu matn boʻyicha savollar boʻladi. Kerak boʻlsa, savollar paytida matnni qayta ochib oʻqishingiz mumkin.</p>
      <div class="fact-card"><img src="${LOGO_MARK}" alt=""><div class="txt">${nextFact()}</div></div>
      <div class="footer-actions">
        <span></span>
        <button class="btn brand" id="goReading">Savollarga o'tish →</button>
      </div>
    </div>
  `;
}

/* ---------------- speaking ----------------
   Admin (19.10.2026): speaking'ni sun'iy intellekt baholasin, o'quvchi kutib qolmasin. Har javob yozib olinadi
   (16 kHz WAV) va o'quvchi keyingi topshiriqqa o'tgan zahoti fonda Gemini'ga (jadvaldagi Apps Script orqali)
   yuboriladi — oxirgi topshiriqdan keyin bir necha soniyada baho tayyor. Mikrofon bo'lmasa — eski tartib:
   xodim tinglaydi va yulduzcha qo'yadi. */
function circumference(r){ return 2*Math.PI*r; }
function renderSpeaking(){
  const step = currentStep();
  const p = SPEAKING[step.idx];
  const r=28, C=circumference(r);
  let izoh, holatHtml = '', tugmalar;
  if(state.mic==='yoq'){
    izoh = `Ovoz chiqarib, <b>ingliz tilida</b> javob bering. Mikrofon ishlamadi — javobingizni xodimimiz tinglab baholaydi. Tayyor bo'lgach, davom eting.`;
    tugmalar = `<span></span><button class="btn brand" id="doneSpeak">Javob berdim, keyingisi →</button>`;
  } else if(state.rec==='yozmoqda'){
    izoh = `<b>Ingliz tilida</b> gapiring. Tugatgach, tugmani bosing.`;
    holatHtml = `<div class="meter"><div id="meterFill"></div></div><div class="rec-holat on">Yozilmoqda…</div>`;
    tugmalar = `<span></span><button class="btn brand" id="stopBtn">Tugatdim, keyingisi →</button>`;
  } else if(state.rec==='jim'){
    izoh = `Ovozingiz eshitilmadi. Mikrofonni barmoq bilan to'smang, telefonni yaqinroq tutib, qayta yozing.`;
    holatHtml = `<div class="rec-holat">⚠ Ovoz eshitilmadi</div>`;
    tugmalar = `<button class="linkbtn" id="otkazBtn">O'tkazib yuborish</button><button class="btn rec" id="qaytaBtn">🎤 Qayta yozish</button>`;
  } else {
    izoh = `Topshiriqni o'qing. Tayyor bo'lgach tugmani bosing va <b>ingliz tilida</b> gapiring (45 soniyagacha). Javobingizni sun'iy intellekt baholaydi.`;
    holatHtml = `<div class="rec-holat">${state.mic===null ? "Brauzer mikrofonga ruxsat so'rasa, «Ruxsat berish»ni bosing." : ""}</div>`;
    tugmalar = `<span></span><button class="btn rec" id="recBtn">🎤 Gapirishni boshlash</button>`;
  }
  return `
    <div class="pad">
      <div class="eyebrow"><span class="dot"></span>Speaking bo'limi</div>
      ${progressStepper()}
      <div class="qmeta"><span>Topshiriq ${step.idx+1} / ${SPEAKING.length}</span><span>Speaking</span></div>
      <div class="speak-wrap">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="${r}" fill="none" stroke="#e2ddd6" stroke-width="6"/>
          <circle id="ringFill" cx="36" cy="36" r="${r}" fill="none" stroke="#e84e10" stroke-width="6"
            stroke-dasharray="${C}" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 36 36)"/>
          <text id="ringText" x="36" y="41" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#e84e10">${Math.max(0,state.speakSecondsLeft)}</text>
        </svg>
        <div>
          <div class="speak-prompt">${esc(p.uz)}</div>
          <div class="speak-en">${esc(p.en)}</div>
        </div>
      </div>
      <p class="rec-hint">${izoh}</p>
      ${holatHtml}
      <div class="fact-card"><img src="${LOGO_MARK}" alt=""><div class="txt">${state.fakt || nextFact()}</div></div>
      <div class="footer-actions">${tugmalar}</div>
    </div>
  `;
}

function startSpeakTimer(){
  clearSpeakTimer();
  state.speakTimerId = setInterval(()=>{
    state.speakSecondsLeft--;
    updateRing();
    if(state.speakSecondsLeft<=0){ clearSpeakTimer(); advanceSpeaking(); }
  }, 1000);
}
function updateRing(){
  const ring = document.getElementById('ringFill');
  const text = document.getElementById('ringText');
  if(!ring||!text) return;
  const r=28, C=circumference(r);
  const frac = Math.max(0, state.speakSecondsLeft/45);
  ring.setAttribute('stroke-dashoffset', String(C*(1-frac)));
  text.textContent = Math.max(0,state.speakSecondsLeft);
}
function advanceSpeaking(){
  clearSpeakTimer();
  if(state.rec==='yozmoqda'){ yozishniTugat(); return; }   // 45 soniya tugadi — yozuv o'zi to'xtaydi
  goToNextStep();
}

async function yozishniBoshla(){
  const btn = document.getElementById('recBtn') || document.getElementById('qaytaBtn');
  if(btn) btn.disabled = true;
  try{
    await Ovoz.tayyorla();            // birinchi marta — brauzer mikrofonga ruxsat so'raydi
  }catch(e){
    console.warn("Mikrofon ishlamadi:", e && (e.name || e.message));
    Ovoz.yop();
    state.mic = 'yoq';
    state.speakSecondsLeft = 45;
    render();
    startSpeakTimer();
    return;
  }
  state.mic = 'ok';
  state.rec = 'yozmoqda';
  state.speakSecondsLeft = 45;
  Ovoz.boshla();
  render();
  Ovoz.onLevel = rms => {
    const el = document.getElementById('meterFill');
    if(el) el.style.width = Math.min(100, Math.round(rms*350)) + '%';
  };
  startSpeakTimer();
}

function yozishniTugat(){
  clearSpeakTimer();
  Ovoz.onLevel = null;
  const yozuv = Ovoz.toxta();
  const w = wavTayyorla(yozuv.pcm, yozuv.rate);
  if(!w){ Ovoz.yop(); Ovoz.yangidan(); state.rec = 'jim'; render(); return; }   // qayta yozishda hammasi yangidan
  state.rec = 'tayyor';
  baholat(currentStep().idx, w.b64, state.id);   // fonda — o'quvchi kutmaydi
  goToNextStep();
}

/* ---------------- scoring ---------------- */
function scoreToLevel(correct40){
  if(correct40<=12) return 0;
  if(correct40<=18) return 1;
  if(correct40<=24) return 2;
  if(correct40<=30) return 3;
  if(correct40<=35) return 4;
  return 5;
}
function qualityOf(pct){
  if(pct>=80) return {label:"Kuchli", color:"#4c7a4a"};
  if(pct>=55) return {label:"O'rta", color:"#a97d1f"};
  return {label:"Zaif", color:"#b8362c"};
}
function remainingRoadmap(levelIdx){
  const items = [];
  let sum = 0;
  for(let i=levelIdx;i<LEVELS.length;i++){
    items.push({level:LEVELS[i], months:LEVEL_DURATION_MONTHS[i]});
    sum += LEVEL_DURATION_MONTHS[i];
  }
  return {items, totalMonths: sum};
}
function fmtMonths(m){
  return (Number.isInteger(m) ? m : m.toFixed(1)) + " oy";
}

let finalData = null;
// yozma qism (grammatika + reading) tugashi bilan: natija hisoblanadi va jadvalga yuboriladi
function yozmaYakun(){
  const totalCorrect = state.grammarCorrect + state.readingCorrect;
  const levelIdx = scoreToLevel(totalCorrect);
  const percent = Math.round((totalCorrect/TOTAL_ITEMS)*100);
  const id = Date.now()+'-'+Math.random().toString(36).slice(2,7);
  state.id = id;
  finalData = {
    id, levelIdx, percent, totalCorrect,
    grammarCorrect: state.grammarCorrect, grammarTotal: 30,
    readingCorrect: state.readingCorrect, readingTotal: 10,
    speakingRating: 0,
  };
  yubor({t:"natija", id, ism:state.name.trim(), tel:state.phone.trim(), daraja:LEVELS[levelIdx], foiz:percent,
         togri:totalCorrect, gram:state.grammarCorrect, read:state.readingCorrect,
         javoblar:javoblarMatni(), xatolar:xatolarMatni()})
    .then(ok=>{ if(state.id===id){ state.natijaHolat = ok; holat(ok); } });
}
function harf(i){ return i==null ? '-' : String.fromCharCode(65+i); }
function javoblarMatni(){
  const g = state.javoblar.filter(j=>j.k==='G').map(j=>harf(j.t)).join('');
  const r = state.javoblar.filter(j=>j.k==='R').map(j=>harf(j.t)).join('');
  let k = 0;
  const rq = READING.map(p=>{ const t = r.slice(k, k+p.questions.length); k += p.questions.length; return t; }).filter(Boolean).join(' ');
  return "G: " + (g.match(/.{1,5}/g)||[]).join(' ') + " | R: " + rq;
}
function xatolarMatni(){
  const out = []; let gn = 0, rn = 0;
  state.javoblar.forEach(j=>{
    const n = j.k==='G' ? ++gn : ++rn;
    if(j.t !== j.a) out.push(j.k + n + ": " + harf(j.t) + " (to‘g‘risi " + harf(j.a) + ")");
  });
  return out.length ? out.join("; ") : "yo‘q";
}
function finalizeResult(){
  clearSpeakTimer();
  Ovoz.yop();                         // mikrofon o'chadi
  if(!finalData) yozmaYakun();
  state.screen='final';
  render();
}

/* ---------------- gauge svg ---------------- */
function gaugeSvg(percent, levelIdx){
  const w=520, h=90, trackY=44, trackH=16, padX=14;
  const usableW = w - padX*2;
  const segW = usableW/6;
  let segs = '';
  for(let i=0;i<6;i++){
    const x = padX + segW*i;
    segs += `<rect x="${x}" y="${trackY}" width="${segW-3}" height="${trackH}" rx="4" fill="${LEVEL_COLORS[i]}" opacity="${i===levelIdx?1:0.28}"/>`;
    segs += `<text x="${x+segW/2-1.5}" y="${trackY+trackH+16}" text-anchor="middle" font-size="10" fill="#6b5f55" font-family="JetBrains Mono, monospace">${esc(GAUGE_LABELS[i])}</text>`;
  }
  const markerX = padX + usableW*(percent/100);
  return `
  <div class="gauge-wrap">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
      ${segs}
      <g transform="translate(${markerX},${trackY-8})">
        <polygon points="0,0 -8,-12 8,-12" fill="#2a2320"/>
        <text x="0" y="-16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="13" fill="#2a2320">${percent}%</text>
      </g>
    </svg>
  </div>`;
}

/* ---------------- final ---------------- */
function renderFinal(){
  const d = finalData;
  const idx = d.levelIdx;
  const color = LEVEL_COLORS[idx];
  const gPct = Math.round((d.grammarCorrect/d.grammarTotal)*100);
  const rPct = Math.round((d.readingCorrect/d.readingTotal)*100);
  const gQ = qualityOf(gPct);
  const rQ = qualityOf(rPct);
  const roadmap = remainingRoadmap(idx);
  setTimeout(()=>burstConfetti(document.getElementById('app')), 50);

  const roadmapRows = roadmap.items.map((it,i)=>`
    <div class="road-row">
      <div class="road-dot" style="background:${i===0?color:'var(--line)'};border-color:${i===0?color:'var(--ink-soft)'};"></div>
      <div class="road-txt"><b>${esc(it.level)}</b>${i===0?' <span class="road-here">— siz shu yerdasiz</span>':''}</div>
      <div class="road-months">${fmtMonths(it.months)}</div>
    </div>`).join('');


  return `
    <div class="pad">
      <div class="eyebrow"><span class="dot"></span>Natija tayyor</div>
      <div class="transition-wrap">
        ${gaugeSvg(d.percent, idx)}
        <div class="congrats-box">
          <div class="big">🎉 Tabriklaymiz, ${esc(state.name)}!</div>
          <p>Siz <b>Registon o'quv markazida</b> <strong style="color:${color};">${esc(LEVELS[idx])}</strong> darajasidan boshlaysiz. ${esc(LEVEL_DESC[idx])} Ishonchingiz uchun rahmat!</p>
        </div>

        <h2 style="align-self:flex-start;font-size:16px;margin-top:6px;">Bo'limlar bo'yicha natija</h2>
        <div class="section-cards">
          <div class="section-card">
            <div class="sc-head">🔤 Grammatika</div>
            <div class="sc-bar-track"><div class="sc-bar-fill" style="width:${gPct}%;background:${gQ.color};"></div></div>

function burstConfetti(container){
  if(!container) return;
  for(let i=0;i<28;i++){

    el.className='confetti-piece';
    el.style.left = (Math.random()*90+5)+'%';
    el.style.background = LEVEL_COLORS[Math.floor(Math.random()*LEVEL_COLORS.length)];
    el.style.animationDelay = (Math.random()*0.35)+'s';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    container.appendChild(el);
    setTimeout(()=>{ if(el.parentNode) el.remove(); }, 2300);
  }
}

/* ---------------- natija → Google Sheets ----------------
   Admin (19.10.2026): «javoblarni telegramga emas google sheetsga jo'natadigan qilish kerak». Natija, speaking
   bahosi va xodim yulduzchasi jadvalga bog'langan Google Apps Script veb-ilovasiga boradi (registon-avtopost:
   sayt/test/apps_script/Code.gs). Gemini kaliti o'sha skriptda — sahifada hech qanday kalit yo'q. Internet bo'lmasa
   natija shu qurilmada navbatda turadi va keyingi ochilishda yuboriladi. */
const JADVAL = "https://script.google.com/macros/s/AKfycbzCmMlkLjim2DlYlfgwEHbDBaqV_i_bjijiCEUDuWepWb-HwUH_Vw01wS4JjI8qcAST/exec";
const NAVBAT = "rgn-daraja-jadval";
try{ localStorage.removeItem("rgn-daraja-navbat"); }catch(e){}   // eski (Telegram) navbat — endi kerak emas

async function jonat(obj, ms){
  const ctl = window.AbortController ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms || 30000) : null;
  try{
    // matn ko'rinishidagi JSON — «oddiy» so'rov (CORS tekshiruvisiz); Google javob sahifasiga yo'naltiradi
    const r = await fetch(JADVAL, {method:"POST", body:JSON.stringify(obj), redirect:"follow", signal: ctl ? ctl.signal : undefined});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally {
    if(t) clearTimeout(t);
  }
}
function navbat(){ try{ return JSON.parse(localStorage.getItem(NAVBAT)||"[]"); }catch(e){ return []; } }
function navbatSaqla(l){ try{ localStorage.setItem(NAVBAT, JSON.stringify(l.slice(-30))); }catch(e){} }
let navbatXotira = null;   // localStorage ishlamasa (yashirin rejim) — sahifa ochiq turganda xotirada
let zanjir = Promise.resolve(true);
async function hammasiniYubor(){
  for(;;){
    const l = navbatXotira || navbat();
    if(!l.length) return true;
    try{
      const js = await jonat(l[0], 30000);
      if(js && js.ok === false) console.warn("Jadval qabul qilmadi:", js.xato);
    }catch(e){
      return false;
    }
    const l2 = navbatXotira || navbat();
    l2.shift();
    navbatSaqla(l2);
    if(navbatXotira) navbatXotira = l2;
  }
}
function navbatniYubor(){ zanjir = zanjir.then(hammasiniYubor, hammasiniYubor); return zanjir; }
function yubor(obj){
  const l = navbatXotira || navbat();
  l.push(obj);
  navbatSaqla(l);
  if(!navbatXotira && navbat().length !== l.length) navbatXotira = l;
  return navbatniYubor();
}
function holat(ok, nima){
  const el = document.getElementById('yuborHolat');
  if(!el) return;
  nima = nima || "Natija";
  el.textContent = ok===true ? "✓ "+nima+" markazga yuborildi"
    : ok===false ? "Internet yo'q: "+nima.toLowerCase()+" saqlandi va internet bo'lganda yuboriladi"
    : nima+" markazga yuborilmoqda…";
  el.className = "yubor" + (ok===true ? " ok" : ok===false ? " kut" : "");
}

/* ---------------- ovoz yozish ----------------
   Web Audio: mikrofon → PCM → 16 kHz mono WAV. Gemini WAV'ni rasmiy qabul qiladi; iPhone (Safari) va Android'da
   bir xil ishlaydi (MediaRecorder formatlari har xil bo'lgani uchun u ishlatilmadi). */
function ovozBormi(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext || window.webkitAudioContext));
}
const Ovoz = {
  ctx:null, stream:null, src:null, proc:null, bufs:[], len:0, yozmoqda:false, onLevel:null,
  async tayyorla(){
    if(!ovozBormi()) throw new Error("mikrofon yo'q");
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!this.ctx) this.ctx = new AC();
    const davom = this.ctx.state==='suspended' ? this.ctx.resume() : Promise.resolve();   // iPhone: bosish ichida
    if(!(this.stream && this.stream.active)){
      this.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
      this.src = this.ctx.createMediaStreamSource(this.stream);
      this.proc = this.ctx.createScriptProcessor(4096, 1, 1);
      this.proc.onaudioprocess = e => {
        if(!this.yozmoqda) return;
        const d = e.inputBuffer.getChannelData(0);
        this.bufs.push(new Float32Array(d));
        this.len += d.length;
        if(this.onLevel){ let s=0; for(let i=0;i<d.length;i+=4) s += d[i]*d[i]; this.onLevel(Math.sqrt(s/(d.length/4))); }
      };
      this.src.connect(this.proc);
      this.proc.connect(this.ctx.destination);
    }
    await davom;
    if(this.ctx.state==='suspended') await this.ctx.resume();
  },
  boshla(){ this.bufs=[]; this.len=0; this.yozmoqda=true; },
  toxta(){
    this.yozmoqda = false;
    const pcm = new Float32Array(this.len);
    let o = 0;
    this.bufs.forEach(b=>{ pcm.set(b, o); o += b.length; });
    this.bufs = []; this.len = 0;
    return {pcm, rate: this.ctx ? this.ctx.sampleRate : 48000};
  },
  yop(){
    this.yozmoqda = false; this.onLevel = null;
    try{ if(this.stream) this.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    try{ if(this.proc){ this.proc.onaudioprocess = null; this.proc.disconnect(); } if(this.src) this.src.disconnect(); }catch(e){}
    this.stream = null; this.src = null; this.proc = null;
  },
  // ba'zi iPhone'larda birinchi ulanish jimjit bo'lib qoladi — qayta yozishda AudioContext ham yangidan ochiladi
  yangidan(){ try{ if(this.ctx && this.ctx.close) this.ctx.close(); }catch(e){} this.ctx = null; },
};

// 16 kHz ga tushiradi, boshidagi va oxiridagi jimlikni kesadi. Ovoz umuman bo'lmasa — null (qayta yozish so'raladi)
function wavTayyorla(pcm, rate){
  const R = 16000, k = rate / R, n = Math.floor(pcm.length / k);
  if(n < R*0.3) return null;
  const x = new Float32Array(n);
  for(let i=0;i<n;i++){
    const a = Math.floor(i*k), b = Math.max(a+1, Math.floor((i+1)*k));
    let s = 0, c = 0;
    for(let j=a; j<b && j<pcm.length; j++){ s += pcm[j]; c++; }
    x[i] = c ? s/c : 0;
  }
  const F = 320, nf = Math.floor(n/F), e = new Float32Array(nf);   // 20 ms bo'laklar
  let eng = 0;
  for(let f=0; f<nf; f++){
    let s = 0;
    for(let j=f*F; j<(f+1)*F; j++) s += x[j]*x[j];
    e[f] = Math.sqrt(s/F);
    if(e[f] > eng) eng = e[f];
  }
  if(eng < 0.01) return null;
  const chegara = Math.max(0.006, eng*0.08);
  let bosh = 0, ox = nf-1;
  while(bosh < nf && e[bosh] < chegara) bosh++;
  while(ox > bosh && e[ox] < chegara) ox--;
  // gapga o'xshashmi: nutqda bo'g'in va pauzalar bor — ovoz kuchi tez o'zgaradi (o'zgaruvchanlik 0,35+);
  // bir tekis ohang, g'uvillash, shovqin — 0,05 dan past. Bunday yozuvni Gemini «gap» deb o'ylab topishi mumkin
  let yig = 0, yig2 = 0;
  for(let f=bosh; f<=ox; f++){ yig += e[f]; yig2 += e[f]*e[f]; }
  const soni = ox - bosh + 1, ort = yig/soni;
  if(Math.sqrt(Math.max(0, yig2/soni - ort*ort)) / ort < 0.2) return null;
  const s0 = Math.max(0, (bosh-15)*F), s1 = Math.min(n, (ox+16)*F);   // ±0,3 s zaxira
  const m = s1 - s0;
  const buf = new ArrayBuffer(44 + m*2), dv = new DataView(buf);
  const yoz = (o, t) => { for(let i=0;i<t.length;i++) dv.setUint8(o+i, t.charCodeAt(i)); };
  yoz(0,"RIFF"); dv.setUint32(4, 36+m*2, true); yoz(8,"WAVE"); yoz(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,R,true);
  dv.setUint32(28,R*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); yoz(36,"data"); dv.setUint32(40,m*2,true);
  for(let i=0;i<m;i++){ const v = Math.max(-1, Math.min(1, x[s0+i])); dv.setInt16(44+i*2, v<0 ? v*0x8000 : v*0x7FFF, true); }
  return {b64: b64Bayt(new Uint8Array(buf)), soniya: m/R};
}
function b64Bayt(u8){
  let s = "";
  for(let i=0; i<u8.length; i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
  return btoa(s);
}

/* ---------------- sun'iy intellekt bahosi ---------------- */
function kut(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function baholat(i, audio, id){
  state.speak[i] = {holat:'kutilmoqda'};
  let js = null;
  for(let u=0; u<2 && !(js && js.ok); u++){
    if(u) await kut(1200);
    try{ js = await jonat({t:"speaking", id, i, audio, ism:state.name.trim()}, 60000); }catch(e){ js = null; }
    if(js && !js.ok && /chegara|sozlanmagan|audio|raqami/.test(String(js.xato||""))) break;   // qayta urinish befoyda
  }
  if(state.id !== id) return;        // bu orada yangi o'quvchi boshlagan
  state.speak[i] = (js && js.ok && js.baho) ? {holat:'tayyor', baho:js.baho} : {holat:'xato'};
  yangilaSpeaking();
}

const CEFR = ["Pre-A1","A1","A2","B1","B2","C1","C2"];
const CEFR_PAST = [0,15,30,45,60,75,90];    // Code.gs dagi bilan bir xil
const CEFR_UZ = {"Pre-A1":"endi boshlaysiz", "A1":"boshlang'ich (Beginner)", "A2":"elementar (Elementary)",
  "B1":"o'rta (Intermediate)", "B2":"o'rtadan yuqori (Upper-Intermediate)", "C1":"yuqori (Advanced)", "C2":"mukammal (Proficiency)"};
function speakJami(){
  const ok = state.speak.filter(s=>s && s.holat==='tayyor').map(s=>s.baho);
  if(!ok.length) return null;
  const o = k => ok.reduce((a,b)=>a+(Number(b[k])||0), 0)/ok.length;
  const ball = Math.round(o('ball'));
  let k = 0;
  CEFR_PAST.forEach((p,j)=>{ if(ball >= p) k = j; });
  return {cefr:CEFR[k], ball, soni:ok.length,
    sub:[["Ravonlik",o('ravonlik')],["Lug'at",o('lugat')],["Grammatika",o('grammatika')],["Talaffuz",o('talaffuz')]]};
}
function speakKartaIchi(){
  const yulduz = `<div class="stars" id="starsWrap">${[1,2,3,4,5].map(n=>`<span class="star${finalData && finalData.speakingRating>=n ? ' filled' : ''}" data-n="${n}">★</span>`).join('')}</div>`;
  const yozildi = state.speak.filter(Boolean).length;
  if(state.mic==='yoq' || !yozildi){
    return `<div class="sc-head">🎤 Speaking</div>
      <p style="font-size:12.5px;margin:4px 0 8px;">Javoblar yozib olinmadi — speaking'ni xodimimiz tinglab baholaydi. Menejer shu yerda baho qo'ysin:</p>${yulduz}`;
  }
  const kutilmoqda = state.speak.filter(s=>s && s.holat==='kutilmoqda').length;
  const j = speakJami();
  if(kutilmoqda && !j){
    return `<div class="sc-head">🎤 Speaking</div>
      <div class="ai-wait"><div class="spin"></div><div>Sun'iy intellekt javoblaringizni tinglab baholamoqda… <b>${yozildi-kutilmoqda}/${yozildi}</b></div></div>`;
  }
  if(!j){
    return `<div class="sc-head">🎤 Speaking</div>
      <p style="font-size:12.5px;margin:4px 0 8px;">Hozir avtomatik baholab bo'lmadi — javobingizni xodimimiz tinglab baholaydi. Menejer shu yerda baho qo'ysin:</p>${yulduz}`;
  }
  const bir = v => (Math.round(v*10)/10).toString().replace('.', ',');
  const sub = j.sub.map(([nom,v])=>`<div>${nom}</div><div class="tr"><div style="width:${Math.round(v/5*100)}%"></div></div><div class="v">${bir(v)}/5</div>`).join('');
  const izohlar = state.speak.map((s,i)=> s && s.holat==='tayyor' && s.baho.izoh ? `<li><b>${i+1}-topshiriq:</b> ${esc(s.baho.izoh)}</li>` : '').join('');
  // dastlabki javoblar bahosi darhol ko'rinadi, qolgani tayyor bo'lgach qo'shiladi
  const qolgan = kutilmoqda ? `<div class="ai-wait" style="margin:0 0 8px;"><div class="spin"></div><div>Yana ${kutilmoqda} ta javob baholanmoqda…</div></div>` : '';
  return `<div class="sc-head">🎤 Speaking <span style="font-weight:500;color:var(--ink-soft);">(sun'iy intellekt bahosi)</span></div>
    ${qolgan}
    <div class="ai-top"><div class="cefr">${esc(j.cefr)}</div>
      <div class="cefr-txt">Gapirish darajangiz: ${esc(CEFR_UZ[j.cefr]||'')}<br><b>${j.ball}/100</b> ball${j.soni<yozildi ? ` · ${j.soni}/${yozildi} topshiriq bo'yicha` : ''}</div></div>
    <div class="sub">${sub}</div>
    ${izohlar ? `<ul class="ai-izoh">${izohlar}</ul>` : ''}
    <div class="ai-note">Baho taxminiy: sun'iy intellekt qisqa javoblaringizni tinglab qo'ydi. Ustozlarimiz birinchi darsda aniqlashtiradi.</div>`;
}
function yangilaSpeaking(){
  const el = document.getElementById('speakKarta');
  if(!el) return;
  el.innerHTML = speakKartaIchi();
  starlarniUla();
}
function starlarniUla(){
  const w = document.getElementById('starsWrap');
  if(!w || !finalData) return;
  const els = w.querySelectorAll('.star');
  els.forEach(el=>{
    el.addEventListener('click', ()=>{
      const n = parseInt(el.dataset.n, 10);
      finalData.speakingRating = n;
      els.forEach(s=> s.classList.toggle('filled', parseInt(s.dataset.n,10) <= n));
      yubor({t:"xodim", id:finalData.id, baho:n}).then(ok=>holat(ok, "Speaking bahosi"));
    });
  });
}

render();
navbatniYubor();
